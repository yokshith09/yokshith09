<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="img" aria-label="divider"><title>divider</title><defs>
  <linearGradient id="d-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#03040d"/><stop offset="1" stop-color="#0b0a24"/>
  </linearGradient>
  <linearGradient id="d-neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/>
    <stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <filter id="d-glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="d-soft" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
  <linearGradient id="d-line" x1="0" x2="1">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#a78bfa"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient></defs>
<line x1="40" y1="18" x2="1160" y2="18" stroke="url(#d-line)" stroke-width="2.5"/>
<g filter="url(#d-glow)">
  <circle cy="18" r="3.5" fill="#fff"><animate attributeName="cx" values="40;1160" dur="6s" repeatCount="indefinite"/></circle>
  <circle cy="18" r="2.2" fill="#22d3ee"><animate attributeName="cx" values="1160;40" dur="9s" repeatCount="indefinite"/></circle>
</g>
<g fill="#a78bfa"><circle cx="600" cy="18" r="5"/><circle cx="600" cy="18" r="10" fill="none" stroke="#a78bfa" stroke-opacity=".5">
  <animate attributeName="r" values="6;14;6" dur="3s" repeatCount="indefinite"/></circle></g></svg>
