 @keyframes panelIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
 @keyframes barFill{0%{transform:scaleX(.05);opacity:.4}100%{transform:scaleX(1);opacity:1}}
 .name{animation:glowPulse 2.4s ease-in-out infinite}
 .cursor{animation:cursorBlink 1s steps(1,end) infinite}
 .role1{animation:reveal .7s ease-out .15s both}.role2{animation:reveal .7s ease-out .45s both}
 .role3{animation:reveal .7s ease-out .75s both}.role4{animation:reveal .7s ease-out 1.05s both}
 .panel{animation:panelIn .8s ease-out both}
 .project{animation:reveal .7s ease-out both}
 .p1{animation-delay:.1s}.p2{animation-delay:.25s}.p3{animation-delay:.4s}.p4{animation-delay:.55s}.p5{animation-delay:.7s}
 .stat{animation:reveal .65s ease-out both}.s1{animation-delay:.1s}.s2{animation-delay:.25s}.s3{animation-delay:.4s}.s4{animation-delay:.55s}
 .langbar{transform-box:fill-box;transform-origin:left;animation:barFill 1.2s ease-out both}
 a{text-decoration:none}
 a:hover text{fill:#ffffff}
 </style>
