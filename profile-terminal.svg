 <style>
 .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
 .cyan{fill:#22aaff}.white{fill:#dce8f4}.orange{fill:#ffad35}.green{fill:#18c978}.muted{fill:#63809a}
