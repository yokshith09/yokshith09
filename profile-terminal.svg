 <style>
 .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
 .cyan{fill:#22aaff}.white{fill:#dce8f4}.orange{fill:#ffad35}.green{fill:#18c978}.muted{fill:#63809a}
 .heading{font-size:23px;font-weight:700}.label{font-size:18px;font-weight:700}.body{font-size:18px}.small{font-size:15px}
 .panel{fill:#080f17;stroke:#1b354b;stroke-width:1.5}.rule{stroke:#526b80;stroke-width:1.4}
 @keyframes glowPulse{0%,100%{opacity:1;filter:drop-shadow(0 0 2px #168cff)}50%{opacity:.82;filter:drop-shadow(0 0 9px #168cff)}}
 @keyframes cursorBlink{0%,48%{opacity:1}49%,100%{opacity:0}}
 @keyframes reveal{0%{opacity:.25;transform:translateX(-8px)}100%{opacity:1;transform:translateX(0)}}
 @keyframes scan{0%{stroke-dashoffset:560}100%{stroke-dashoffset:0}}
 .name{animation:glowPulse 2.4s ease-in-out infinite}
 .cursor{animation:cursorBlink 1s steps(1,end) infinite}
 .role1{animation:reveal .7s ease-out .15s both}.role2{animation:reveal .7s ease-out .45s both}
 .role3{animation:reveal .7s ease-out .75s both}.role4{animation:reveal .7s ease-out 1.05s both}
 .scanline{stroke:#22aaff;stroke-width:2;stroke-dasharray:560;animation:scan 2.2s ease-out infinite}
 </style>
